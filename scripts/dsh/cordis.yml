# SuperWHV policy overlay for the official DeepSeek Harness ACP profile.
# The installer passes this file as the final `dsh --profile acp --patch` layer.
# It preserves the approved v0 tool surface and fails closed on sandbox policy.

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_PERSISTENCE_ROOT ?? ((process.env.HOME || process.env.USERPROFILE) + '/.agentwharf/dsh/sessions')

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_WORKSPACE_ROOT ?? process.cwd()

- id: approval
  config:
    policy: ask

- id: acp
  config:
    provider: deepseek-official
    model: !!js process.env.DEEPSEEK_MODEL ?? 'deepseek-v4-flash'

- id: system-prompt
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your shell and filesystem tools run under a workspace-write sandbox; a file-access denial is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

# SuperWHV does not opt user sessions into upstream telemetry.
- id: session-telemetry-otel
  disabled: true

# Keep the approved v0 surface: shell, filesystem, todo, token meter, and
# compaction. All other model-facing or auxiliary execution surfaces stay off.
